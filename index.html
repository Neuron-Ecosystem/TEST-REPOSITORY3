<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Ecosystem | Main Node</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05050a;
            --accent: #ff8c00;
            --accent-glow: rgba(255, 140, 0, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #e6edf3;
            --text-dim: #a0a0c0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            overflow-x: hidden; 
            min-height: 100vh;
        }

        #canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* --- АНИМАЦИИ --- */
        @keyframes cardSpawn {
            0% { opacity: 0; transform: translateY(40px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes pulseMic {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(255, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        /* --- HEADER --- */
        .header-ui {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;
            backdrop-filter: blur(25px); padding: 20px 30px; border-radius: 24px;
            border: 1px solid var(--glass-border); background: var(--glass);
            position: relative; z-index: 5000;
        }

        .logo-box { display: flex; align-items: center; gap: 15px; color: var(--accent); }
        .logo-text { font-size: 1.5rem; font-weight: 800; letter-spacing: 5px; text-transform: uppercase; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }

        /* --- УВЕДОМЛЕНИЯ --- */
        .notification-container { position: relative; }
        .notification-bell {
            background: none; border: none; color: var(--text-dim);
            font-size: 1.5rem; cursor: pointer; transition: 0.3s; padding: 5px;
        }
        .bell-dot {
            position: absolute; top: 5px; right: 5px; width: 10px; height: 10px;
            background: #ff4444; border-radius: 50%; border: 2px solid var(--bg); display: none;
        }

        .news-dropdown {
            position: absolute; top: calc(100% + 15px); right: 0; width: 320px;
            background: #0a0b14; border: 1px solid var(--accent); border-radius: 20px;
            backdrop-filter: blur(30px); display: none; flex-direction: column; z-index: 10000;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9); overflow: hidden;
        }
        .news-dropdown.show { display: flex; animation: cardSpawn 0.3s ease-out forwards; }

        /* --- КАРТОЧКИ --- */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 60px; }

        .node-card {
            background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 30px; padding: 35px; text-decoration: none; color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; animation: cardSpawn 0.8s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }
        .node-card:hover { border-color: var(--accent); transform: translateY(-10px); background: rgba(255, 140, 0, 0.05); }
        .node-icon { font-size: 2.5rem; color: var(--accent); margin-bottom: 20px; }

        /* --- ПОИСК --- */
        #search-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(5,5,10,0.98); z-index: 20000; justify-content: center; padding-top: 10vh;
        }
        .search-container { width: 90%; max-width: 600px; text-align: center; }
        #search-input {
            width: 100%; background: rgba(255,255,255,0.05); border: 2px solid var(--accent); 
            color: #fff; padding: 20px; border-radius: 20px; font-size: 1.4rem; outline: none;
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .suggestion-item {
            background: rgba(255,255,255,0.03); margin-top: 10px; padding: 15px; border-radius: 15px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s;
            text-align: left; animation: cardSpawn 0.4s ease forwards;
        }
        .suggestion-item:hover { background: var(--accent); color: #000; }

        /* --- FOOTER & MIC --- */
        .footer { text-align: center; padding: 60px 20px; border-top: 1px solid var(--glass-border); }
        .mic-btn {
            position: fixed; bottom: 30px; right: 30px; width: 70px; height: 70px;
            background: var(--accent); border-radius: 50%; display: flex;
            justify-content: center; align-items: center; cursor: pointer; z-index: 9999;
        }
        .mic-btn.active { background: #ff4444; animation: pulseMic 1.5s infinite; }

        @media (max-width: 768px) {
            .news-dropdown { position: fixed; top: 85px; right: 15px; left: 15px; width: auto; }
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="container">
    <header class="header-ui">
        <div class="logo-box"><i class="fas fa-brain"></i> <span class="logo-text">Neuron</span></div>
        <div class="nav-actions">
            <div class="search-trigger" onclick="toggleSearch()" style="cursor:pointer; font-size:1.3rem"><i class="fas fa-search"></i></div>
            <div class="notification-container">
                <button class="notification-bell" onclick="toggleNewsDropdown()">
                    <i class="fas fa-bell"></i>
                    <span class="bell-dot" id="bell-dot"></span>
                </button>
                <div class="news-dropdown" id="news-dropdown">
                    <div id="news-list"></div>
                </div>
            </div>
            <button class="btn-donate" onclick="toggleDonate()" style="background:var(--accent); border:none; padding:10px 20px; border-radius:12px; font-weight:800; cursor:pointer">$$$</button>
        </div>
    </header>

    <div class="services-grid" id="main-grid"></div>

    <footer class="footer">
        <div class="social-icons">
            <a href="https://t.me/neuron_ecosystem" style="color:#fff; font-size:2rem; margin:0 15px"><i class="fab fa-telegram"></i></a>
            <a href="https://vk.com/club233118101" style="color:#fff; font-size:2rem; margin:0 15px"><i class="fab fa-vk"></i></a>
        </div>
        <p style="margin-top:20px; opacity:0.3">NEURON 2026</p>
    </footer>
</div>

<div id="search-modal" onclick="toggleSearch()">
    <div class="search-container" onclick="event.stopPropagation()">
        <input type="text" id="search-input" placeholder="Говорите или печатайте..." autocomplete="off">
        <div id="search-results"></div>
    </div>
</div>

<div class="mic-btn" id="mic-btn" onclick="runVoice()"><i class="fas fa-microphone" style="color:#000; font-size:1.6rem"></i></div>

<script>
    const services = [
        { name: "Neuron Status", url: "https://status.neuron-p2p.ru", icon: "fa-signal", desc: "Живой мониторинг аптайма всех систем экосистемы.", tags: ["статус", "онлайн", "status", "работа", "мониторинг", "раб"] }, 
        { name: "Neuron AI", url: "https://neuron-ai-eta.vercel.app/", icon: "fa-robot", desc: "Нейросетевой хаб для генерации и анализа данных.", tags: ["ии", "ai", "нейросеть", "нейронка", "гпт", "нейро", "иишка", "генерация"] }, 
        { name: "Neuron Notes", url: "notes.html", icon: "fa-sticky-note", desc: "Безопасное хранилище ваших идей и черновиков.", tags: ["заметки", "блокнот", "текст", "запиши", "напиши", "заметочка", "заметка", "метка", "меточка"] }, 
        { name: "Neuron Converter", url: "https://converter.neuron-p2p.ru", icon: "fa-exchange-alt", desc: "Быстрая конвертация любых величин и валют.", tags: ["конвертер", "валюта", "деньги", "перевод"] }, 
        { name: "Digital Studio", url: "studio.html", icon: "fa-palette", desc: "Создание интерфейсов и цифрового искусства.", tags: ["студия", "дизайн", "studio", "сайт", "домен"] }, 
        { name: "Neuron Tools", url: "https://tools.neuron-p2p.ru", icon: "fa-tools", desc: "Инструментарий для разработчиков и инженеров.", tags: ["тулс", "инструменты", "tools", "инструмент"] }, 
        { name: "Neuron Budget", url: "https://budget.neuron-p2p.ru", icon: "fa-wallet", desc: "Учет личных финансов в защищенном контуре.", tags: ["бюджет", "деньги", "кошелек", "траты", "операции", "операция", "аналитика"] }, 
        { name: "Neuron Study", url: "https://study.neuron-p2p.ru", icon: "fa-graduation-cap", desc: "Платформа для обучения и хранения знаний.", tags: ["учеба", "школа", "лекции", "учится", "дз", "домашнее задание", "school"] }, 
        { name: "Neuron Link", url: "https://link.neuron-p2p.ru", icon: "fa-shield-alt", desc: "Сервис для анонимизации и защиты внешних ссылок.", tags: ["линк", "ссылка", "безопасность", "тег"] }, 
        { name: "Neuron Calendar", url: "https://calendar.neuron-p2p.ru", icon: "fa-calendar-alt", desc: "Планировщик задач с синхронизацией узлов.", tags: ["календарь", "время", "планы", "план", "планировщик", "событие"] }, 
        { name: "Game Hub", url: "https://game-hub.neuron-p2p.ru", icon: "fa-gamepad", desc: "Игровой сегмент для отдыха внутри системы.", tags: ["игры", "гейм", "отдых", "игра", "пазл", "пазлы", "печать", "2048"] }, 
        { name: "Pass Generator", url: "https://password-generator.neuron-p2p.ru", icon: "fa-key", desc: "Создание паролей с максимальной энтропией.", tags: ["пароль", "безопасность", "ключ", "пароли", "пас", "пасс", "pass", "password"] }, 
        { name: "Neuron Synapse", url: "https://synapse.neuron-p2p.ru", icon: "fa-network-wired", desc: "Шифрованный протокол связи между пользователями.", tags: ["чат", "связь", "синапс", "аноним", "разговор", "писать"] }, 
        { name: "What If", url: "https://ifwhat.ru", icon: "fa-infinity", desc: "Анализ альтернативных сценариев и гипотез.", tags: ["что если", "история", "сценарии", "вдруг", "гипотеза", "сценарий", "альтернатива"] },
        { name: "Донат", url: "https://yoomoney.ru/to/4100119394883694", icon: "fa-heart", desc: "Поддержать проект.", tags: ["донат", "деньги", "donate", "пожертвование", "помощь", "помочь", "help"] }
    ];

    function init() {
        document.getElementById('main-grid').innerHTML = services.map((s, i) => `
            <a href="${s.url}" class="node-card" style="animation-delay: ${i * 0.1}s" target="_blank">
                <i class="fas ${s.icon} node-icon"></i>
                <h3 class="node-title">${s.name}</h3>
                <p style="color:var(--text-dim); font-size:0.9rem">Перейти в модуль</p>
            </a>
        `).join('');
    }

    // ЛОГИКА ПОИСКА
    const searchInput = document.getElementById('search-input');
    const resultsBox = document.getElementById('search-results');

    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase();
        resultsBox.innerHTML = '';
        if (!query) return;

        const filtered = services.filter(s => 
            s.name.toLowerCase().includes(query) || 
            s.tags.some(t => t.includes(query))
        );

        filtered.forEach(s => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerHTML = `<i class="fas ${s.icon}"></i> <span>${s.name}</span>`;
            div.onclick = () => window.open(s.url, '_blank');
            resultsBox.appendChild(div);
        });
    });

    // ГОЛОСОВОЕ УПРАВЛЕНИЕ
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'ru-RU';
    recognition.interimResults = false;

    function runVoice() {
        try {
            recognition.start();
            document.getElementById('mic-btn').classList.add('active');
        } catch(e) { console.log("Уже запущено"); }
    }

    recognition.onresult = (event) => {
        const result = event.results[0][0].transcript.toLowerCase();
        document.getElementById('mic-btn').classList.remove('active');
        
        // Поиск совпадения
        const found = services.find(s => 
            result.includes(s.name.toLowerCase()) || 
            s.tags.some(t => result.includes(t))
        );

        if (found) {
            window.open(found.url, '_blank');
        } else {
            toggleSearch();
            searchInput.value = result;
            searchInput.dispatchEvent(new Event('input'));
        }
    };

    recognition.onend = () => document.getElementById('mic-btn').classList.remove('active');

    function toggleSearch() {
        const m = document.getElementById('search-modal');
        const isVisible = m.style.display === 'flex';
        m.style.display = isVisible ? 'none' : 'flex';
        if (!isVisible) {
            searchInput.value = '';
            resultsBox.innerHTML = '';
            setTimeout(() => searchInput.focus(), 100);
        }
    }

    function toggleNewsDropdown() {
        document.getElementById('news-dropdown').classList.toggle('show');
    }

    function toggleDonate() { window.open('https://yoomoney.ru/to/4100119394883694', '_blank'); }

    // Фон Canvas
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = 'rgba(255,140,0,0.1)';
        for(let i=0; i<30; i++) {
            ctx.beginPath(); ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 1, 0, Math.PI*2); ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    draw();
    init();

    window.onclick = (e) => {
        if (!e.target.closest('.notification-container')) document.getElementById('news-dropdown').classList.remove('show');
    };
</script>
</body>
</html>
