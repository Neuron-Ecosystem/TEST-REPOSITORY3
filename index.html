<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Ecosystem | Main Node</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05050a;
            --accent: #ff8c00;
            --accent-glow: rgba(255, 140, 0, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #e6edf3;
            --text-dim: #a0a0c0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; 
            min-height: 100vh;
        }

        #canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(255, 140, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0); }
        }

        /* --- HEADER --- */
        .header-ui {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;
            backdrop-filter: blur(25px); padding: 20px 30px; border-radius: 24px;
            border: 1px solid var(--glass-border); background: var(--glass);
            animation: slideDown 0.8s ease; position: relative; z-index: 2000;
        }

        .logo-box { display: flex; align-items: center; gap: 12px; color: var(--accent); font-weight: 800; letter-spacing: 4px; text-transform: uppercase; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }

        /* --- УВЕДОМЛЕНИЯ --- */
        .notification-container { position: relative; }
        .notification-bell {
            background: none; border: none; color: var(--text-dim);
            font-size: 1.4rem; cursor: pointer; transition: 0.3s; padding: 5px;
        }
        .bell-dot {
            position: absolute; top: 5px; right: 5px; width: 10px; height: 10px;
            background: #ff4444; border-radius: 50%; border: 2px solid var(--bg); display: none;
        }

        .news-dropdown {
            position: absolute; top: calc(100% + 15px); right: 0; width: 320px;
            background: #0a0b14; border: 1px solid var(--accent); border-radius: 20px;
            backdrop-filter: blur(30px); display: none; flex-direction: column; z-index: 9999;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); overflow: hidden;
        }
        .news-dropdown.show { display: flex; animation: slideDown 0.3s ease forwards; }

        /* --- КНОПКИ --- */
        .btn-donate {
            background: var(--accent); color: #000; border: none; padding: 12px 24px; 
            border-radius: 14px; font-weight: 800; cursor: pointer; transition: 0.3s;
            animation: pulse 2s infinite;
        }

        .search-trigger { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; cursor: pointer; color: var(--text-dim); }

        /* --- СЕТКА СЕРВИСОВ --- */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 50px; }

        .node-card {
            background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 28px; padding: 30px; text-decoration: none; color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; animation: fadeInUp 0.6s ease forwards;
        }
        .node-card:hover { border-color: var(--accent); transform: translateY(-12px); background: rgba(255,255,255,0.05); }
        .node-icon { font-size: 2.2rem; color: var(--accent); margin-bottom: 15px; }
        .node-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        .node-desc { font-size: 0.9rem; color: var(--text-dim); line-height: 1.5; }

        /* --- НИЖНИЙ ВИДЖЕТ --- */
        .news-widget {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 28px; padding: 25px; margin-bottom: 60px;
            animation: fadeInUp 0.8s ease forwards; animation-delay: 0.4s;
        }
        .news-widget-item { display: flex; gap: 15px; padding: 12px; border-radius: 15px; background: rgba(0,0,0,0.2); margin-bottom: 10px; }

        /* --- FOOTER --- */
        .footer { text-align: center; padding: 50px; border-top: 1px solid var(--glass-border); background: var(--glass); border-radius: 40px 40px 0 0; }
        .social-link { font-size: 1.8rem; margin: 0 12px; color: var(--text-dim); transition: 0.3s; }
        .social-link:hover { color: var(--accent); transform: translateY(-5px); }

        /* МИКРОФОН */
        .mic-btn {
            position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px;
            background: var(--accent); border-radius: 50%; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            z-index: 5000; box-shadow: 0 10px 30px var(--accent-glow);
        }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ */
        @media (max-width: 768px) {
            .header-ui { padding: 15px 20px; }
            .logo-text { font-size: 1.2rem; letter-spacing: 2px; }
            .btn-donate { padding: 10px 15px; font-size: 0.8rem; }
            
            .news-dropdown {
                position: absolute;
                top: 60px;
                right: -10px; /* Выравнивание под колокольчик */
                width: calc(100vw - 40px);
                max-width: 340px;
            }
            .news-widget-item { flex-direction: column; gap: 5px; }
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="container">
    <header class="header-ui">
        <div class="logo-box"><i class="fas fa-brain"></i> <span class="logo-text">Neuron</span></div>
        <div class="nav-actions">
            <div class="search-trigger" onclick="toggleSearch()"><i class="fas fa-search"></i></div>
            <div class="notification-container">
                <button class="notification-bell" onclick="toggleNewsDropdown()">
                    <i class="fas fa-bell"></i>
                    <span class="bell-dot" id="bell-dot"></span>
                </button>
                <div class="news-dropdown" id="news-dropdown">
                    <div id="news-list"></div>
                </div>
            </div>
            <button class="btn-donate" onclick="toggleDonate()">ДОНАТ</button>
        </div>
    </header>

    <div class="services-grid" id="main-grid"></div>

    <div class="news-widget">
        <div style="color:var(--accent); font-weight:800; margin-bottom:15px; font-size:0.9rem;">
            <i class="fas fa-rss"></i> ПОСЛЕДНИЕ ОБНОВЛЕНИЯ
        </div>
        <div id="news-widget-list"></div>
    </div>

    <footer class="footer">
        <div class="social-icons">
            <a href="https://t.me/neuron_ecosystem" target="_blank" class="social-link"><i class="fab fa-telegram"></i></a>
            <a href="https://vk.com/club233118101" target="_blank" class="social-link"><i class="fab fa-vk"></i></a>
            <a href="https://www.tiktok.com/@neuron_eco" target="_blank" class="social-link"><i class="fab fa-tiktok"></i></a>
            <span class="social-link" onclick="copyEmail()" style="cursor:pointer"><i class="fas fa-envelope"></i></span>
        </div>
        <p style="margin-top:25px; opacity:0.3; letter-spacing:2px; font-size:0.8rem;">NEURON ECOSYSTEM &copy; 2026</p>
    </footer>
</div>

<div id="search-modal" onclick="toggleSearch()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:10000; justify-content:center; padding-top:15vh;">
    <div class="search-container" onclick="event.stopPropagation()" style="width:90%; max-width:600px">
        <input type="text" id="search-input" placeholder="Поиск сервиса..." style="width:100%; background:none; border:2px solid var(--accent); color:#fff; padding:15px; border-radius:15px; outline:none; font-size:1.2rem;">
        <div id="suggestions" style="margin-top:20px;"></div>
    </div>
</div>

<div class="mic-btn" id="mic-btn" onclick="toggleVoice()"><i class="fas fa-microphone" style="color:#000; font-size:1.4rem"></i></div>

<script>
    const services = [
        { name: "Neuron Status", url: "https://status.neuron-p2p.ru", icon: "fa-signal", desc: "Живой мониторинг аптайма всех систем экосистемы.", tags: ["статус", "онлайн", "status", "работа", "мониторинг", "раб"] }, 
        { name: "Neuron AI", url: "https://neuron-ai-eta.vercel.app/", icon: "fa-robot", desc: "Нейросетевой хаб для генерации и анализа данных.", tags: ["ии", "ai", "нейросеть", "нейронка", "гпт", "нейро", "иишка", "генерация"] }, 
        { name: "Neuron Notes", url: "notes.html", icon: "fa-sticky-note", desc: "Безопасное хранилище ваших идей и черновиков.", tags: ["заметки", "блокнот", "текст", "запиши", "напиши", "заметочка", "заметка", "метка", "меточка"] }, 
        { name: "Neuron Converter", url: "https://converter.neuron-p2p.ru", icon: "fa-exchange-alt", desc: "Быстрая конвертация любых величин и валют.", tags: ["конвертер", "валюта", "деньги", "перевод"] }, 
        { name: "Digital Studio", url: "studio.html", icon: "fa-palette", desc: "Создание интерфейсов и цифрового искусства.", tags: ["студия", "дизайн", "studio", "сайт", "домен"] }, 
        { name: "Neuron Tools", url: "https://tools.neuron-p2p.ru", icon: "fa-tools", desc: "Инструментарий для разработчиков и инженеров.", tags: ["тулс", "инструменты", "tools", "инструмент"] }, 
        { name: "Neuron Budget", url: "https://budget.neuron-p2p.ru", icon: "fa-wallet", desc: "Учет личных финансов в защищенном контуре.", tags: ["бюджет", "деньги", "кошелек", "траты", "операции", "операция", "аналитика"] }, 
        { name: "Neuron Study", url: "https://study.neuron-p2p.ru", icon: "fa-graduation-cap", desc: "Платформа для обучения и хранения знаний.", tags: ["учеба", "школа", "лекции", "учится", "дз", "домашнее задание", "school"] }, 
        { name: "Neuron Link", url: "https://link.neuron-p2p.ru", icon: "fa-shield-alt", desc: "Сервис для анонимизации и защиты внешних ссылок.", tags: ["линк", "ссылка", "безопасность", "тег"] }, 
        { name: "Neuron Calendar", url: "https://calendar.neuron-p2p.ru", icon: "fa-calendar-alt", desc: "Планировщик задач с синхронизацией узлов.", tags: ["календарь", "время", "планы", "план", "планировщик", "событие"] }, 
        { name: "Game Hub", url: "https://game-hub.neuron-p2p.ru", icon: "fa-gamepad", desc: "Игровой сегмент для отдыха внутри системы.", tags: ["игры", "гейм", "отдых", "игра", "пазл", "пазлы", "печать", "2048"] }, 
        { name: "Pass Generator", url: "https://password-generator.neuron-p2p.ru", icon: "fa-key", desc: "Создание паролей с максимальной энтропией.", tags: ["пароль", "безопасность", "ключ", "пароли", "пас", "пасс", "pass", "password"] }, 
        { name: "Neuron Synapse", url: "https://synapse.neuron-p2p.ru", icon: "fa-network-wired", desc: "Шифрованный протокол связи между пользователями.", tags: ["чат", "связь", "синапс", "аноним", "разговор", "писать"] }, 
        { name: "What If", url: "https://ifwhat.ru", icon: "fa-infinity", desc: "Анализ альтернативных сценариев и гипотез.", tags: ["что если", "история", "сценарии", "вдруг", "гипотеза", "сценарий", "альтернатива"] },
        { name: "Донат", url: "https://yoomoney.ru/to/4100119394883694", icon: "fa-heart", desc: "Поддержать проект.", tags: ["донат", "деньги", "donate", "пожертвование", "помощь", "помочь", "help"] }
    ];

    const ALL_NEWS = [
        { id: 2, date: "20.01.26", text: "Исправлена мобильная адаптация и открытие уведомлений под колокольчиком." },
        { id: 1, date: "20.01.26", text: "Анимации появления карточек полностью восстановлены." }
    ];

    function init() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = services.map((s, i) => `
            <a href="${s.url}" class="node-card" style="--i: ${i}; animation-delay: ${i * 0.1}s" target="_blank">
                <i class="fas ${s.icon} node-icon"></i>
                <h3 class="node-title">${s.name}</h3>
                <p class="node-desc">${s.desc}</p>
            </a>
        `).join('');

        document.getElementById('news-list').innerHTML = ALL_NEWS.map(n => `
            <div style="padding:15px; border-bottom:1px solid rgba(255,255,255,0.05)">
                <small style="color:var(--accent)">${n.date}</small>
                <p style="font-size:0.85rem; margin-top:4px;">${n.text}</p>
            </div>
        `).join('');

        document.getElementById('news-widget-list').innerHTML = ALL_NEWS.map(n => `
            <div class="news-widget-item">
                <span style="color:var(--accent); font-weight:bold; min-width:80px; font-size:0.8rem;">${n.date}</span>
                <span style="font-size:0.9rem;">${n.text}</span>
            </div>
        `).join('');

        if (ALL_NEWS[0].id > (localStorage.getItem('last_id') || 0)) document.getElementById('bell-dot').style.display = 'block';
    }

    function toggleNewsDropdown() {
        const d = document.getElementById('news-dropdown');
        d.classList.toggle('show');
        if(d.classList.contains('show')) {
            document.getElementById('bell-dot').style.display = 'none';
            localStorage.setItem('last_id', ALL_NEWS[0].id);
        }
    }

    function toggleSearch() {
        const m = document.getElementById('search-modal');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        if(m.style.display === 'flex') document.getElementById('search-input').focus();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        const res = document.getElementById('suggestions');
        res.innerHTML = '';
        if(!val) return;
        services.filter(s => s.name.toLowerCase().includes(val) || s.tags.some(t => t.includes(val))).forEach(s => {
            const div = document.createElement('div');
            div.style.padding = '15px'; div.style.background = 'rgba(255,255,255,0.05)'; div.style.cursor = 'pointer'; div.style.marginBottom = '5px'; div.style.borderRadius = '10px';
            div.innerHTML = `<i class="fas ${s.icon}" style="color:var(--accent); margin-right:15px"></i> ${s.name}`;
            div.onclick = () => window.open(s.url, '_blank');
            res.appendChild(div);
        });
    });

    function toggleDonate() { window.open('https://yoomoney.ru/to/4100119394883694', '_blank'); }
    function copyEmail() { navigator.clipboard.writeText('wertq6306@gmail.com'); alert('Email скопирован!'); }

    // Голос
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'ru-RU';
    function toggleVoice() { try { recognition.start(); } catch(e) {} }
    recognition.onstart = () => document.getElementById('mic-btn').style.background = '#ff4444';
    recognition.onend = () => document.getElementById('mic-btn').style.background = 'var(--accent)';
    recognition.onresult = (e) => {
        const query = e.results[0][0].transcript.toLowerCase();
        const s = services.find(x => query.includes(x.name.toLowerCase()) || x.tags.some(t => query.includes(t)));
        if(s) window.open(s.url, '_blank');
    };

    // Фон
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = 'rgba(255,140,0,0.15)';
        for(let i=0; i<40; i++) { ctx.beginPath(); ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 1, 0, Math.PI*2); ctx.fill(); }
        requestAnimationFrame(draw);
    }
    draw();
    init();

    window.onclick = (e) => {
        if (!e.target.closest('.notification-container')) document.getElementById('news-dropdown').classList.remove('show');
    };
</script>
</body>
</html>
