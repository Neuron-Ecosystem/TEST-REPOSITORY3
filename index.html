<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Ecosystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 180px);
            gap: 20px;
            max-width: 1100px; width: 100%;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-decoration: none; color: white;
            display: flex; flex-direction: column; justify-content: flex-end;
        }
        .card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #6366f1;
            transform: scale(1.02);
        }
        .card i { font-size: 2rem; margin-bottom: auto; color: #6366f1; }
        .card h3 { font-size: 1.2rem; margin-bottom: 4px; }
        .card p { font-size: 0.85rem; color: #aaa; }

        /* Размеры карточек */
        .large { grid-column: span 2; grid-row: span 2; background: linear-gradient(45deg, rgba(99,102,241,0.1), transparent); }
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }

        @media (max-width: 768px) {
            .bento-grid { display: flex; flex-direction: column; }
            .card { min-height: 150px; }
        }
    </style>
</head>
<body>
    <div class="bento-grid">
        <a href="https://neurondigital.tilda.ws" class="card large">
            <i class="fas fa-palette"></i>
            <h3>Digital Studio</h3>
            <p>Брендинг и разработка сложных SaaS-решений для бизнеса.</p>
        </a>

        <a href="https://neuron-ai-eta.vercel.app/" class="card wide">
            <i class="fas fa-brain"></i>
            <h3>Neuron AI</h3>
            <p>Интеллектуальное ядро системы.</p>
        </a>

        <a href="https://synapse.neuron-p2p.ru" class="card">
            <i class="fas fa-comments"></i>
            <h3>Synapse</h3>
            <p>P2P Chat.</p>
        </a>

        <a href="notes.html" class="card tall">
            <i class="fas fa-sticky-note"></i>
            <h3>Notes</h3>
            <p>Твои мысли под полным контролем.</p>
        </a>

        <a href="https://converter.neuron-p2p.ru" class="card">
            <i class="fas fa-exchange-alt"></i>
            <h3>Converter</h3>
        </a>

        <a href="https://budget.neuron-p2p.ru" class="card wide">
            <i class="fas fa-wallet"></i>
            <h3>Budget Tracker</h3>
            <p>Финансовая аналитика 2026.</p>
        </a>
    </div>
</body>
</html>
