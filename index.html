<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Ecosystem | Neural Mesh 2.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05050a;
            --accent: #ff8c00;
            --accent-glow: rgba(255, 140, 0, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #e6edf3;
            --text-dim: #a0a0c0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; 
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent; /* Убирает синий блик при нажатии на мобильных */
        }
        
        #canvas { position: fixed; top: 0; left: 0; z-index: -1; filter: blur(0.5px); }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; /* Уменьшил отступы для мобильных */
        }

        /* Адаптивный Header */
        .header-ui {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px;
            backdrop-filter: blur(15px); 
            padding: 15px 20px; 
            border-radius: 20px;
            border: 1px solid var(--glass-border); 
            background: var(--glass);
            flex-wrap: wrap; /* Чтобы элементы могли переноситься если тесно */
            gap: 15px;
        }

        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-text { font-size: 1.3rem; font-weight: 800; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }

        .nav-actions { display: flex; gap: 10px; align-items: center; width: 100%; justify-content: space-between; }
        
        @media (min-width: 768px) {
            .container { padding: 40px 20px; }
            .header-ui { padding: 20px 30px; margin-bottom: 50px; flex-wrap: nowrap; }
            .nav-actions { width: auto; justify-content: flex-end; gap: 15px; }
            .logo-text { font-size: 1.5rem; letter-spacing: 5px; }
        }

        .btn-donate {
            background: var(--accent); color: #000; border: none; padding: 10px 15px; 
            border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s;
            font-size: 0.9rem; white-space: nowrap;
        }

        .search-trigger {
            background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
            padding: 10px 15px; border-radius: 12px; color: var(--text-dim);
            cursor: pointer; display: flex; align-items: center; gap: 10px; flex-grow: 1;
        }

        /* Адаптивная Сетка */
        .services-grid { 
            display: grid; 
            grid-template-columns: 1fr; /* По умолчанию 1 колонка (мобилки) */
            gap: 15px; 
            margin-bottom: 40px; 
        }

        @media (min-width: 640px) {
            .services-grid { grid-template-columns: repeat(2, 1fr); } /* Планшеты */
        }

        @media (min-width: 1024px) {
            .services-grid { grid-template-columns: repeat(3, 1fr); } /* ПК */
            .services-grid { gap: 20px; }
        }

        .node-card {
            background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; text-decoration: none; color: inherit;
            transition: all 0.3s ease; display: flex; flex-direction: column; height: 100%;
        }
        
        @media (hover: hover) {
            .node-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(255, 140, 0, 0.1); }
        }

        .node-icon { font-size: 1.8rem; color: var(--accent); margin-bottom: 12px; }
        .node-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .node-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; flex-grow: 1; }

        /* Футер */
        .footer { 
            text-align: center; padding: 30px 15px; border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(10px); background: var(--glass); border-radius: 25px 25px 0 0;
        }
        .social-icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .social-link { color: var(--text); font-size: 1.5rem; transition: 0.3s; cursor: pointer; text-decoration: none; padding: 5px; }

        /* Мобильные модалки */
        .modal-content {
            background: #10111a; border: 1px solid var(--accent); padding: 30px 20px;
            border-radius: 20px; text-align: center; width: 90%; max-width: 400px;
        }

        #search-modal { padding-top: 5vh; }
        .search-container { width: 95%; max-width: 600px; }
        .search-input { width: 100%; padding: 15px; border-radius: 12px; font-size: 1.1rem; }

        .mic-btn {
            position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px;
            background: var(--accent); border-radius: 50%; display: flex; justify-content: center;
            align-items: center; z-index: 100; color: #000; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        @media (min-width: 768px) {
            .mic-btn { bottom: 30px; right: 30px; width: 65px; height: 65px; }
        }

        .copy-toast { bottom: 90px; font-size: 0.9rem; padding: 8px 20px; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="container">
    <header class="header-ui">
        <div class="logo-box">
            <i class="fas fa-brain" style="color: var(--accent);"></i>
            <span class="logo-text">Neuron</span>
        </div>
        <div class="nav-actions">
            <div class="search-trigger" onclick="toggleSearch()">
                <i class="fas fa-search"></i> <span>Поиск...</span>
            </div>
            <button class="btn-donate" onclick="toggleDonate()">Поддержать</button>
        </div>
    </header>

    <div class="services-grid" id="main-grid"></div>

    <footer class="footer">
        <div class="social-icons">
            <a href="https://t.me/neuron_ecosystem" target="_blank" class="social-link"><i class="fab fa-telegram"></i></a>
            <a href="https://vk.com/club233118101" target="_blank" class="social-link"><i class="fab fa-vk"></i></a>
            <a href="https://www.tiktok.com/@neuron_eco" target="_blank" class="social-link"><i class="fab fa-tiktok"></i></a>
            <div class="social-link" onclick="copyEmail()"><i class="fas fa-envelope"></i></div>
        </div>
        <p style="opacity: 0.4; font-size: 0.7rem; letter-spacing: 2px;">NEURON ECOSYSTEM 2026</p>
    </footer>
</div>

<div class="modal-overlay" id="donate-modal" onclick="toggleDonate()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; justify-content:center; align-items:center;">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2>Поддержка</h2>
        <p style="margin-top:10px; opacity:0.8;">Все средства пойдут на развитие проекта ❤️</p>
        <button class="btn-big-donate" style="background:var(--accent); border:none; padding:15px; width:100%; border-radius:12px; font-weight:bold; margin-top:20px; cursor:pointer;" onclick="window.open('https://yoomoney.ru/to/4100119394883694', '_blank')">Поддержать</button>
    </div>
</div>

<div class="copy-toast" id="toast">Email скопирован!</div>

<div id="search-modal" onclick="toggleSearch()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:3000; flex-direction:column; align-items:center;">
    <div class="search-container" onclick="event.stopPropagation()" style="margin-top:10vh;">
        <input type="text" class="search-input" id="search-input" placeholder="Введите название или команду..." autocomplete="off" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--accent); color:#fff; padding:15px; border-radius:12px; outline:none;">
        <div class="suggestions" id="suggestions" style="background:rgba(255,255,255,0.03); margin-top:10px; border-radius:12px; max-height:50vh; overflow-y:auto;"></div>
    </div>
</div>

<div class="mic-btn" id="mic-btn" onclick="toggleVoice()"><i class="fas fa-microphone"></i></div>

<script>
    const services = [
        { name: "Neuron Status", url: "https://status.neuron-p2p.ru", icon: "fa-signal", desc: "Мониторинг узлов сети.", tags: ["статус", "работа", "сервер", "пингуй", "status"] },
        { name: "Neuron Notes", url: "notes.html", icon: "fa-sticky-note", desc: "Умные заметки для идей.", tags: ["заметки", "блокнот", "запиши", "notes"] },
        { name: "Neuron Converter", url: "https://converter.neuron-p2p.ru", icon: "fa-exchange-alt", desc: "Конвертер величин.", tags: ["конвертер", "валюта", "деньги", "перевод"] },
        { name: "Neuron AI", url: "https://neuron-ai-eta.vercel.app/", icon: "fa-robot", desc: "Ядро интеллекта.", tags: ["ии", "ai", "нейросеть", "нейронка", "бот", "гпт", "gpt"] },
        { name: "Digital Studio", url: "studio.html", icon: "fa-palette", desc: "Студия дизайна.", tags: ["студия", "дизайн", "studio"] },
        { name: "Neuron Tools", url: "https://tools.neuron-p2p.ru", icon: "fa-tools", desc: "Полезные утилиты.", tags: ["тулс", "инструменты", "tools"] },
        { name: "Neuron Calendar", url: "https://calendar.neuron-p2p.ru", icon: "fa-calendar-alt", desc: "Умный планировщик.", tags: ["календарь", "планы", "calendar"] },
        { name: "Neuron Study", url: "https://study.neuron-p2p.ru", icon: "fa-graduation-cap", desc: "Приложение для учебы.", tags: ["учеба", "школа", "study"] },
        { name: "Neuron Budget", url: "https://budget.neuron-p2p.ru", icon: "fa-wallet", desc: "Трекер финансов.", tags: ["бюджет", "деньги", "budget", "money"] },
        { name: "Game Hub", url: "https://game-hub.neuron-p2p.ru", icon: "fa-gamepad", desc: "Коллекция игр.", tags: ["игры", "гейм", "game"] },
        { name: "Password Generator", url: "https://password-generator.neuron-p2p.ru", icon: "fa-key", desc: "Надежные пароли.", tags: ["пароль", "ключ", "password"] },
        { name: "Neuron Synapse", url: "https://synapse.neuron-p2p.ru", icon: "fa-lock", desc: "P2P чат шифрованный.", tags: ["чат", "мессенджер", "chat"] },
        { name: "Neuron Link", url: "https://link.neuron-p2p.ru", icon: "fa-shield-alt", desc: "Анонимайзер ссылок.", tags: ["линк", "ссылка", "link"] },
        { name: "What If", url: "https://ifwhat.ru", icon: "fa-question-circle", desc: "Миры альтернатив.", tags: ["что если", "история", "if"] },
        { name: "Донат", url: "https://yoomoney.ru/to/4100119394883694", icon: "fa-heart", desc: "Поддержать проект.", tags: ["донат", "деньги", "donate"] }
    ];

    const grid = document.getElementById('main-grid');
    services.filter(s => s.name !== "Донат").forEach(s => {
        grid.innerHTML += `
            <a href="${s.url}" class="node-card" ${s.url.includes('http') ? 'target="_blank"' : ''}>
                <div class="node-icon"><i class="fas ${s.icon}"></i></div>
                <h3 class="node-title">${s.name}</h3>
                <p class="node-desc">${s.desc}</p>
                ${s.name === 'Neuron Status' ? '<div style="color:#00ff88; font-size:0.7rem; margin-top:10px; font-weight:bold;">● ONLINE</div>' : ''}
            </a>`;
    });

    function toggleDonate() {
        const m = document.getElementById('donate-modal');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    function copyEmail() {
        navigator.clipboard.writeText('wertq6306@gmail.com');
        const t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2000);
    }

    function toggleSearch() {
        const modal = document.getElementById('search-modal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        if (modal.style.display === 'flex') document.getElementById('search-input').focus();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
        const v = e.target.value.toLowerCase();
        const box = document.getElementById('suggestions');
        box.innerHTML = '';
        if(!v) return;
        services.filter(s => s.name.toLowerCase().includes(v) || s.tags.some(t => t.includes(v)))
            .forEach(s => {
                const d = document.createElement('div');
                d.style.padding = '12px 15px';
                d.style.cursor = 'pointer';
                d.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                d.innerHTML = `<i class="fas ${s.icon}" style="margin-right:10px; color:var(--accent)"></i> ${s.name}`;
                d.onclick = () => window.open(s.url, '_blank');
                box.appendChild(d);
            });
    });

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'ru-RU';
    function toggleVoice() { try { recognition.start(); } catch(e) {} }
    recognition.onstart = () => document.getElementById('mic-btn').style.background = '#ff4444';
    recognition.onend = () => document.getElementById('mic-btn').style.background = 'var(--accent)';
    recognition.onresult = (e) => {
        const speech = e.results[0][0].transcript.toLowerCase();
        const found = services.find(s => speech.includes(s.name.toLowerCase()) || s.tags.some(t => speech.includes(t)));
        if(found) window.open(found.url, '_blank');
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function res() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    res(); window.addEventListener('resize', res);
    for(let i=0; i<50; i++) pts.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3});
    function anim() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pts.forEach((p,i) => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0||p.x>canvas.width) p.vx*=-1; if(p.y<0||p.y>canvas.height) p.vy*=-1;
            ctx.fillStyle = 'rgba(255,140,0,0.15)'; ctx.beginPath(); ctx.arc(p.x,p.y,1,0,Math.PI*2); ctx.fill();
            for(let j=i+1; j<pts.length; j++) {
                const d = Math.hypot(p.x-pts[j].x, p.y-pts[j].y);
                if(d<120) { ctx.strokeStyle=`rgba(255,140,0,${0.1*(1-d/120)})`; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); }
            }
        });
        requestAnimationFrame(anim);
    }
    anim();
</script>
</body>
</html>
